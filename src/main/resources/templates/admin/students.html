<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Students')}"></head>
<body>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<button class="btn btn-primary mobile-toggle" id="sidebar-toggle"><i class="bi bi-list"></i></button>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar-admin :: sidebar}"></div>
    <main class="main-content">
        <div class="page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div><h1>Students</h1><p>Manage student accounts</p></div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal" onclick="openCreate()">
                <i class="bi bi-plus-lg"></i> Add Student
            </button>
        </div>
        <div class="content-card">
            <div class="status-filter-bar">
                <label class="form-label" for="status-filter">Status</label>
                <select class="form-select form-select-sm" id="status-filter" style="width: auto; min-width: 140px;">
                    <option value="all">All</option>
                    <option value="active">Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>
            <div th:replace="~{fragments/search-bar :: search('table-search', 'Search by name, email, phone or status...')}"></div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="users-table"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="userModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="userModalTitle">Add Student</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form id="user-form">
                <div class="modal-body">
                    <input type="hidden" id="user-id">
                    <div class="mb-3"><label class="form-label">Name</label><input type="text" class="form-control" id="user-name" required></div>
                    <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="user-email" required></div>
                    <div class="mb-3"><label class="form-label">Phone</label><input type="text" class="form-control" id="user-phone" required></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
    requireAuth('ADMIN');
    initSidebar('ADMIN');
    let userModal, users = [];

    document.addEventListener('DOMContentLoaded', () => {
        userModal = new bootstrap.Modal(document.getElementById('userModal'));
        loadUsers();
        initSearch('table-search', () => applyFilters());
        document.getElementById('status-filter').addEventListener('change', applyFilters);
    });

    function userSearchText(u) {
        const status = u.active === true ? 'active' : 'inactive';
        return `${u.name} ${u.email} ${u.phone || ''} ${status}`;
    }

    function applyFilters() {
        const q = document.getElementById('table-search')?.value || '';
        const status = document.getElementById('status-filter')?.value || 'all';
        let list = filterByUserStatus(users, status);
        list = filterItems(list, q, userSearchText);
        renderUsers(list);
    }

    function openCreate() {
        document.getElementById('userModalTitle').textContent = 'Add Student';
        document.getElementById('user-id').value = '';
        document.getElementById('user-form').reset();
    }

    function editUser(id) {
        const u = users.find(x => x.id === id);
        if (!u) return;
        document.getElementById('userModalTitle').textContent = 'Edit Student';
        document.getElementById('user-id').value = u.id;
        document.getElementById('user-name').value = u.name;
        document.getElementById('user-email').value = u.email;
        document.getElementById('user-phone').value = u.phone;
        userModal.show();
    }

    async function loadUsers() {
        try {
            const res = await AdminApi.getStudents();
            users = res.data || [];
            applyFilters();
        } catch (err) { showAlert(err.message, 'danger'); }
    }

    function renderUsers(list) {
        const tbody = document.getElementById('users-table');
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No students found</td></tr>';
            return;
        }
        tbody.innerHTML = list.map(u => `
            <tr class="${isUserActive(u.active) ? '' : 'table-row-inactive'}">
                <td>${u.name}</td>
                <td>${u.email}</td>
                <td>${u.phone || '-'}</td>
                <td>${userStatusBadge(u.active)}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="editUser(${u.id})" title="Edit"><i class="bi bi-pencil"></i></button>
                    ${isUserActive(u.active)
                        ? `<button class="btn btn-sm btn-outline-danger" onclick="deactivateStudent(${u.id})" title="Deactivate"><i class="bi bi-person-x"></i></button>`
                        : '<span class="text-muted small">Deactivated</span>'}
                </td>
            </tr>`).join('');
    }

    async function deactivateStudent(id) {
        if (!confirm('Deactivate this student? Their status will be set to Inactive.')) return;
        try {
            await AdminApi.deleteStudent(id);
            showAlert('Student deactivated successfully');
            loadUsers();
        } catch (err) { showAlert(err.message, 'danger'); }
    }

    document.getElementById('user-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = { name: document.getElementById('user-name').value, email: document.getElementById('user-email').value,
            phone: document.getElementById('user-phone').value, role: 'STUDENT' };
        const id = document.getElementById('user-id').value;
        try {
            if (id) await AdminApi.updateUser(id, body);
            else await AdminApi.createStudent(body);
            showAlert(id ? 'Student updated' : 'Student created');
            userModal.hide();
            loadUsers();
        } catch (err) { showAlert(err.message, 'danger'); }
    });
</script>
</body>
</html>
