<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Assignments')}"></head>
<body>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<button class="btn btn-primary mobile-toggle" id="sidebar-toggle"><i class="bi bi-list"></i></button>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar-admin :: sidebar}"></div>
    <main class="main-content">
        <div class="page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div><h1>Assignments</h1><p>Create and manage assignments</p></div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#assignModal" onclick="openCreate()">
                <i class="bi bi-plus-lg"></i> Create Assignment
            </button>
        </div>
        <div class="content-card">
            <div th:replace="~{fragments/search-bar :: search('table-search', 'Search by title, trainer, student or status...')}"></div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Trainer</th>
                            <th>Assigned Students</th>
                            <th>Due Date</th>
                            <th>Max Marks</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="assignments-table"><tr><td colspan="7" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="assignModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Create Assignment</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form id="assign-form">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">Title</label><input type="text" class="form-control" id="assign-title" required></div>
                        <div class="col-md-6"><label class="form-label">Trainer</label><select class="form-select" id="assign-trainer" required></select></div>
                        <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" id="assign-desc" rows="3" required></textarea></div>
                        <div class="col-md-4"><label class="form-label">Assigned Date</label><input type="datetime-local" class="form-control" id="assign-date" required></div>
                        <div class="col-md-4"><label class="form-label">Due Date</label><input type="datetime-local" class="form-control" id="assign-due" required></div>
                        <div class="col-md-4"><label class="form-label">Max Marks</label><input type="number" class="form-control" id="assign-marks" min="1" required></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="assignStudentsModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Assign to Students</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form id="assign-students-form">
                <div class="modal-body">
                    <input type="hidden" id="assign-to-id">
                    <div th:replace="~{fragments/search-bar :: search('student-assign-search', 'Search students...')}"></div>
                    <div id="student-checkboxes" class="d-flex flex-column gap-2" style="max-height: 320px; overflow-y: auto;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Assign</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
    requireAuth('ADMIN');
    initSidebar('ADMIN');
    let assignModal, assignStudentsModal, trainers = [], students = [], assignments = [];
    let currentAssignId = null;

    document.addEventListener('DOMContentLoaded', async () => {
        assignModal = new bootstrap.Modal(document.getElementById('assignModal'));
        assignStudentsModal = new bootstrap.Modal(document.getElementById('assignStudentsModal'));
        await loadTrainers();
        await loadAssignments();
        initSearch('table-search', q => renderAssignments(filterItems(assignments, q, a => assignmentSearchText(a, trainers))));
        initSearch('student-assign-search', q => {
            if (currentAssignId) renderStudentCheckboxes(currentAssignId, q);
        });
    });

    function openCreate() {
        document.getElementById('assign-form').reset();
        setupAssignmentDates();
    }

    async function loadTrainers() {
        const res = await AdminApi.getTrainers();
        trainers = res.data || [];
        document.getElementById('assign-trainer').innerHTML = trainers.map(t =>
            `<option value="${t.id}">${t.name}</option>`).join('');
    }

    async function loadAssignments() {
        try {
            const [assignRes, studentRes] = await Promise.all([
                AdminApi.getAllAssignments(),
                AdminApi.getStudents()
            ]);
            assignments = assignRes.data || [];
            students = studentRes.data || [];
            const q = document.getElementById('table-search')?.value || '';
            renderAssignments(filterItems(assignments, q, a => assignmentSearchText(a, trainers)));
        } catch (err) { showAlert(err.message, 'danger'); }
    }

    function renderAssignments(list) {
        const data = list !== undefined ? list : assignments;
        const tbody = document.getElementById('assignments-table');
        if (!data.length) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No assignments found. Create one to get started.</td></tr>';
            return;
        }
        tbody.innerHTML = data.map(a => `
            <tr>
                <td class="fw-medium">${a.title}</td>
                <td>${getTrainerName(a.trainerId, trainers)}</td>
                <td><div class="d-flex flex-wrap gap-1">${formatAssignedStudents(a.assignedStudents)}</div></td>
                <td>${formatDate(a.dueDate)}</td>
                <td>${a.maxMarks}</td>
                <td>${statusBadge(a.status)}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="openAssignStudents(${a.id})">Assign</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="closeAssignment(${a.id})">Close</button>
                </td>
            </tr>`).join('');
    }

    document.getElementById('assign-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const assigned = document.getElementById('assign-date').value;
        const due = document.getElementById('assign-due').value;
        const dateErr = validateAssignmentDates(assigned, due);
        if (dateErr) { showAlert(dateErr, 'danger'); return; }

        const body = {
            title: document.getElementById('assign-title').value,
            description: document.getElementById('assign-desc').value,
            assignedDate: fromDateTimeLocal(assigned),
            dueDate: fromDateTimeLocal(due),
            maxMarks: parseInt(document.getElementById('assign-marks').value),
            trainerId: parseInt(document.getElementById('assign-trainer').value)
        };
        try {
            await AdminApi.createAssignment(body);
            showAlert('Assignment created');
            assignModal.hide();
            await loadAssignments();
        } catch (err) { showAlert(err.message, 'danger'); }
    });

    function renderStudentCheckboxes(assignmentId, filterQuery) {
        const assignment = assignments.find(a => a.id === assignmentId);
        const assignedIds = new Set((assignment?.assignedStudents || []).map(s => s.id));
        const q = (filterQuery || '').toLowerCase().trim();
        const filtered = students.filter(s => {
            const text = `${s.name} ${s.email || ''}`.toLowerCase();
            const isAssigned = assignedIds.has(s.id);
            if (!isAssigned && !isUserActive(s.active)) return false;
            return !q || text.includes(q);
        });

        const container = document.getElementById('student-checkboxes');
        if (!filtered.length) {
            container.innerHTML = '<p class="text-muted mb-0">No students match your search.</p>';
            return;
        }

        container.innerHTML = filtered.map(s => `
            <div class="form-check student-check-item">
                <input class="form-check-input" type="checkbox" value="${s.id}" id="stu-${s.id}"
                    ${assignedIds.has(s.id) ? 'checked' : ''}>
                <label class="form-check-label" for="stu-${s.id}">
                    ${s.name} <small class="text-muted">(${s.email})</small>
                    ${assignedIds.has(s.id) ? '<span class="badge bg-success ms-1">Assigned</span>' : ''}
                </label>
            </div>`).join('');
    }

    function openAssignStudents(assignmentId) {
        currentAssignId = assignmentId;
        document.getElementById('assign-to-id').value = assignmentId;
        const searchInput = document.getElementById('student-assign-search');
        if (searchInput) searchInput.value = '';
        renderStudentCheckboxes(assignmentId, '');
        assignStudentsModal.show();
    }

    document.getElementById('assign-students-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const assignmentId = document.getElementById('assign-to-id').value;
        const studentIds = [...document.querySelectorAll('#student-checkboxes input:checked')].map(c => parseInt(c.value));
        if (!studentIds.length) { showAlert('Select at least one student', 'warning'); return; }
        try {
            await AdminApi.assignAssignment(assignmentId, studentIds);
            showAlert('Assignment assigned to students');
            assignStudentsModal.hide();
            await loadAssignments();
        } catch (err) { showAlert(err.message, 'danger'); }
    });

    async function closeAssignment(id) {
        if (!confirm('Close this assignment?')) return;
        try {
            await AdminApi.closeAssignment(id);
            showAlert('Assignment closed');
            await loadAssignments();
        } catch (err) { showAlert(err.message, 'danger'); }
    }
</script>
</body>
</html>
