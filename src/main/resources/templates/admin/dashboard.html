<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Dashboard')}"></head>
<body>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<button class="btn btn-primary mobile-toggle" id="sidebar-toggle"><i class="bi bi-list"></i></button>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar-admin :: sidebar}"></div>
    <main class="main-content">
        <div class="page-header"><h1>Dashboard</h1><p>Welcome back, <span id="welcome-name"></span></p></div>
        <div class="row g-3">
            <div class="col-md-6 col-lg-3">
                <a href="/admin/trainers" class="stat-card-link">
                    <div class="stat-card stat-card-nav">
                        <div class="stat-value" id="stat-trainers">-</div>
                        <div class="stat-label">Trainers</div>
                        <span class="stat-nav-btn">Manage <i class="bi bi-arrow-right"></i></span>
                    </div>
                </a>
            </div>
            <div class="col-md-6 col-lg-3">
                <a href="/admin/students" class="stat-card-link">
                    <div class="stat-card stat-card-nav">
                        <div class="stat-value" id="stat-students">-</div>
                        <div class="stat-label">Students</div>
                        <span class="stat-nav-btn">Manage <i class="bi bi-arrow-right"></i></span>
                    </div>
                </a>
            </div>
            <div class="col-md-6 col-lg-3">
                <a href="/admin/assignments" class="stat-card-link">
                    <div class="stat-card stat-card-nav">
                        <div class="stat-value" id="stat-assignments">-</div>
                        <div class="stat-label">Assignments</div>
                        <span class="stat-nav-btn">Manage <i class="bi bi-arrow-right"></i></span>
                    </div>
                </a>
            </div>
            <div class="col-md-6 col-lg-3">
                <a href="/admin/submissions" class="stat-card-link">
                    <div class="stat-card stat-card-nav">
                        <div class="stat-value">—</div>
                        <div class="stat-label">Submissions</div>
                        <span class="stat-nav-btn">View <i class="bi bi-arrow-right"></i></span>
                    </div>
                </a>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
    requireAuth('ADMIN');
    initSidebar('ADMIN');
    document.getElementById('welcome-name').textContent = getUser().name;
    Promise.all([AdminApi.getTrainers(), AdminApi.getStudents(), AdminApi.getAllAssignments()]).then(([t, s, a]) => {
        document.getElementById('stat-trainers').textContent = t.data?.length ?? 0;
        document.getElementById('stat-students').textContent = s.data?.length ?? 0;
        document.getElementById('stat-assignments').textContent = a.data?.length ?? 0;
    }).catch(err => showAlert(err.message, 'danger'));
</script>
</body>
</html>
