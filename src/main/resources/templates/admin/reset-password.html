<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Reset Password')}"></head>
<body>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<button class="btn btn-primary mobile-toggle" id="sidebar-toggle"><i class="bi bi-list"></i></button>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar-admin :: sidebar}"></div>
    <main class="main-content">
        <div class="page-header"><h1>Reset Password</h1><p>Change your account password</p></div>
        <div class="content-card" style="max-width: 480px;">
            <form id="reset-form">
                <div class="mb-3"><label class="form-label">New Password</label><input type="password" class="form-control" id="new-password" minlength="3" required></div>
                <div class="mb-3"><label class="form-label">Confirm Password</label><input type="password" class="form-control" id="confirm-password" minlength="3" required></div>
                <button type="submit" class="btn btn-primary">Update Password</button>
            </form>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
    requireAuth('ADMIN');
    initSidebar('ADMIN');
    document.getElementById('reset-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const pwd = document.getElementById('new-password').value;
        const confirm = document.getElementById('confirm-password').value;
        if (pwd !== confirm) { showAlert('Passwords do not match', 'danger'); return; }
        try {
            await resetPassword(pwd);
            showAlert('Password updated successfully');
            document.getElementById('reset-form').reset();
        } catch (err) { showAlert(err.message, 'danger'); }
    });
</script>
</body>
</html>
