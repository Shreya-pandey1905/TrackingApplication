<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Submissions')}"></head>
<body>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<button class="btn btn-primary mobile-toggle" id="sidebar-toggle"><i class="bi bi-list"></i></button>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar-super-admin :: sidebar}"></div>
    <main class="main-content">
        <div class="page-header"><h1>Submissions</h1><p>View all submissions</p></div>
        <div class="content-card">
            <div th:replace="~{fragments/search-bar :: search('table-search', 'Search by student, assignment or status...')}"></div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead><tr><th>Student</th><th>Assignment</th><th>Submitted</th><th>Marks</th><th>Status</th></tr></thead>
                    <tbody id="submissions-table"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
    requireAuth('SUPER_ADMIN');
    initSidebar('SUPER_ADMIN');
    SuperAdminApi.getSubmissions().then(res => {
        const tbody = document.getElementById('submissions-table');
        if (!res.data?.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No submissions found</td></tr>'; return; }
        tbody.innerHTML = res.data.map(s => `
            <tr>
                <td>${s.student ? s.student.name : '-'}</td>
                <td>${s.assignment ? s.assignment.title : '-'}</td>
                <td>${formatDate(s.submittedAt)}</td>
                <td>${s.marks != null ? s.marks : '-'}</td>
                <td>${statusBadge(s.status)}</td>
            </tr>`).join('');
        bindTableSearch('table-search', 'submissions-table');
    }).catch(err => showAlert(err.message, 'danger'));
</script>
</body>
</html>
