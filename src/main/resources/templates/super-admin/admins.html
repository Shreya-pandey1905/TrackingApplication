<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admins')}"></head>
<body>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<button class="btn btn-primary mobile-toggle" id="sidebar-toggle"><i class="bi bi-list"></i></button>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar-super-admin :: sidebar}"></div>
    <main class="main-content">
        <div class="page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div><h1>Admins</h1><p>Manage admin accounts</p></div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#adminModal" onclick="openCreateAdmin()">
                <i class="bi bi-plus-lg"></i> Add Admin
            </button>
        </div>
        <div class="content-card">
            <div th:replace="~{fragments/search-bar :: search('table-search', 'Search by name, email or phone...')}"></div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="admins-table"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="adminModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="adminModalTitle">Add Admin</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form id="admin-form">
                <div class="modal-body">
                    <input type="hidden" id="admin-id">
                    <div class="mb-3"><label class="form-label">Name</label><input type="text" class="form-control" id="admin-name" required></div>
                    <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control" id="admin-email" required></div>
                    <div class="mb-3"><label class="form-label">Phone</label><input type="text" class="form-control" id="admin-phone" required></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
    requireAuth('SUPER_ADMIN');
    initSidebar('SUPER_ADMIN');
    let adminModal, allAdmins = [];

    document.addEventListener('DOMContentLoaded', () => {
        adminModal = new bootstrap.Modal(document.getElementById('adminModal'));
        loadAdmins();
        initSearch('table-search', q => renderAdmins(filterItems(allAdmins, q, a => `${a.name} ${a.email} ${a.phone || ''}`)));
    });

    function openCreateAdmin() {
        document.getElementById('adminModalTitle').textContent = 'Add Admin';
        document.getElementById('admin-id').value = '';
        document.getElementById('admin-form').reset();
    }

    async function loadAdmins() {
        try {
            const res = await SuperAdminApi.getAdmins();
            allAdmins = res.data || [];
            const q = document.getElementById('table-search')?.value || '';
            renderAdmins(filterItems(allAdmins, q, a => `${a.name} ${a.email} ${a.phone || ''}`));
        } catch (err) { showAlert(err.message, 'danger'); }
    }

    function renderAdmins(list) {
        const tbody = document.getElementById('admins-table');
        if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No admins found</td></tr>';
            return;
        }
        tbody.innerHTML = list.map(a => `
            <tr>
                <td>${a.name}</td><td>${a.email}</td><td>${a.phone || '-'}</td>
                <td><span class="badge bg-${a.active ? 'success' : 'secondary'}">${a.active ? 'Active' : 'Inactive'}</span></td>
                <td>
                    <button class="btn btn-sm btn-outline-primary me-1" onclick="editAdmin(${a.id})"><i class="bi bi-pencil"></i></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteAdmin(${a.id})"><i class="bi bi-trash"></i></button>
                </td>
            </tr>`).join('');
    }

    async function editAdmin(id) {
        try {
            const res = await SuperAdminApi.getAdmin(id);
            const a = res.data;
            document.getElementById('adminModalTitle').textContent = 'Edit Admin';
            document.getElementById('admin-id').value = a.id;
            document.getElementById('admin-name').value = a.name;
            document.getElementById('admin-email').value = a.email;
            document.getElementById('admin-phone').value = a.phone;
            adminModal.show();
        } catch (err) { showAlert(err.message, 'danger'); }
    }

    async function deleteAdmin(id) {
        if (!confirm('Deactivate this admin?')) return;
        try {
            await SuperAdminApi.deleteAdmin(id);
            showAlert('Admin deactivated');
            loadAdmins();
        } catch (err) { showAlert(err.message, 'danger'); }
    }

    document.getElementById('admin-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const body = {
            name: document.getElementById('admin-name').value,
            email: document.getElementById('admin-email').value,
            phone: document.getElementById('admin-phone').value,
            role: 'ADMIN'
        };
        const id = document.getElementById('admin-id').value;
        try {
            if (id) await SuperAdminApi.updateAdmin(id, body);
            else await SuperAdminApi.createAdmin(body);
            showAlert(id ? 'Admin updated' : 'Admin created');
            adminModal.hide();
            loadAdmins();
        } catch (err) { showAlert(err.message, 'danger'); }
    });
</script>
</body>
</html>
