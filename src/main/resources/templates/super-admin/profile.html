<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Profile')}"></head>
<body>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<button class="btn btn-primary mobile-toggle" id="sidebar-toggle"><i class="bi bi-list"></i></button>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar-super-admin :: sidebar}"></div>
    <main class="main-content">
        <div class="page-header"><h1>Profile</h1><p>Your account information</p></div>
        <div class="content-card" style="max-width: 500px;">
            <dl class="row mb-0">
                <dt class="col-sm-4">Name</dt><dd class="col-sm-8" id="profile-name">-</dd>
                <dt class="col-sm-4">Email</dt><dd class="col-sm-8" id="profile-email">-</dd>
                <dt class="col-sm-4">Role</dt><dd class="col-sm-8" id="profile-role">-</dd>
            </dl>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script>
    requireAuth('SUPER_ADMIN');
    initSidebar('SUPER_ADMIN');
    const u = getUser();
    document.getElementById('profile-name').textContent = u.name;
    document.getElementById('profile-email').textContent = u.email;
    document.getElementById('profile-role').textContent = u.role;
</script>
</body>
</html>
