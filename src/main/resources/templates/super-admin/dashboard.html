<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Dashboard')}"></head>
<body>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<button class="btn btn-primary mobile-toggle" id="sidebar-toggle"><i class="bi bi-list"></i></button>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar-super-admin :: sidebar}"></div>
    <main class="main-content">
        <div class="page-header">
            <h1>Dashboard</h1>
            <p>Overview of the tracking system</p>
        </div>
        <div class="row g-3" id="stats-row">
            <div class="col-md-4 col-lg-3">
                <a href="/super-admin/admins" class="stat-card-link">
                    <div class="stat-card stat-card-nav">
                        <div class="stat-value" id="stat-admins">-</div>
                        <div class="stat-label">Admins</div>
                        <span class="stat-nav-btn">Manage <i class="bi bi-arrow-right"></i></span>
                    </div>
                </a>
            </div>
            <div class="col-md-4 col-lg-3">
                <a href="/super-admin/trainers" class="stat-card-link">
                    <div class="stat-card stat-card-nav">
                        <div class="stat-value" id="stat-trainers">-</div>
                        <div class="stat-label">Trainers</div>
                        <span class="stat-nav-btn">View <i class="bi bi-arrow-right"></i></span>
                    </div>
                </a>
            </div>
            <div class="col-md-4 col-lg-3">
                <a href="/super-admin/students" class="stat-card-link">
                    <div class="stat-card stat-card-nav">
                        <div class="stat-value" id="stat-students">-</div>
                        <div class="stat-label">Students</div>
                        <span class="stat-nav-btn">View <i class="bi bi-arrow-right"></i></span>
                    </div>
                </a>
            </div>
            <div class="col-md-4 col-lg-3">
                <a href="/super-admin/assignments" class="stat-card-link">
                    <div class="stat-card stat-card-nav">
                        <div class="stat-value" id="stat-assignments">-</div>
                        <div class="stat-label">Assignments</div>
                        <span class="stat-nav-btn">View <i class="bi bi-arrow-right"></i></span>
                    </div>
                </a>
            </div>
            <div class="col-md-4 col-lg-3">
                <a href="/super-admin/submissions" class="stat-card-link">
                    <div class="stat-card stat-card-nav">
                        <div class="stat-value" id="stat-submissions">-</div>
                        <div class="stat-label">Submissions</div>
                        <span class="stat-nav-btn">View <i class="bi bi-arrow-right"></i></span>
                    </div>
                </a>
            </div>
            <div class="col-md-4 col-lg-3">
                <a href="/super-admin/submissions" class="stat-card-link">
                    <div class="stat-card stat-card-nav">
                        <div class="stat-value" id="stat-evaluated">-</div>
                        <div class="stat-label">Evaluated</div>
                        <span class="stat-nav-btn">View <i class="bi bi-arrow-right"></i></span>
                    </div>
                </a>
            </div>
            <div class="col-md-4 col-lg-3">
                <a href="/super-admin/submissions" class="stat-card-link">
                    <div class="stat-card stat-card-nav">
                        <div class="stat-value" id="stat-pending">-</div>
                        <div class="stat-label">Pending</div>
                        <span class="stat-nav-btn">View <i class="bi bi-arrow-right"></i></span>
                    </div>
                </a>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
    requireAuth('SUPER_ADMIN');
    initSidebar('SUPER_ADMIN');
    SuperAdminApi.dashboard().then(res => {
        const d = res.data;
        document.getElementById('stat-admins').textContent = d.totalAdmins ?? 0;
        document.getElementById('stat-trainers').textContent = d.totalTrainers ?? 0;
        document.getElementById('stat-students').textContent = d.totalStudents ?? 0;
        document.getElementById('stat-assignments').textContent = d.totalAssignments ?? 0;
        document.getElementById('stat-submissions').textContent = d.totalSubmissions ?? 0;
        document.getElementById('stat-evaluated').textContent = d.evaluatedSubmissions ?? 0;
        document.getElementById('stat-pending').textContent = d.pendingSubmissions ?? 0;
    }).catch(err => showAlert(err.message, 'danger'));
</script>
</body>
</html>
