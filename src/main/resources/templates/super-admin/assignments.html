<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Assignments')}"></head>
<body>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<button class="btn btn-primary mobile-toggle" id="sidebar-toggle"><i class="bi bi-list"></i></button>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar-super-admin :: sidebar}"></div>
    <main class="main-content">
        <div class="page-header"><h1>Assignments</h1><p>View all assignments</p></div>
        <div class="content-card">
            <div th:replace="~{fragments/search-bar :: search('table-search', 'Search by title, trainer or status...')}"></div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead><tr><th>Title</th><th>Trainer</th><th>Due Date</th><th>Max Marks</th><th>Status</th></tr></thead>
                    <tbody id="assignments-table"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
    requireAuth('SUPER_ADMIN');
    initSidebar('SUPER_ADMIN');
    SuperAdminApi.getAssignments().then(res => {
        const tbody = document.getElementById('assignments-table');
        if (!res.data?.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No assignments found</td></tr>'; return; }
        tbody.innerHTML = res.data.map(a => `
            <tr>
                <td>${a.title}</td>
                <td>${a.trainer ? a.trainer.name : '-'}</td>
                <td>${formatDate(a.dueDate)}</td>
                <td>${a.maxMarks}</td>
                <td>${statusBadge(a.status)}</td>
            </tr>`).join('');
        bindTableSearch('table-search', 'assignments-table');
    }).catch(err => showAlert(err.message, 'danger'));
</script>
</body>
</html>
