<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Students')}"></head>
<body>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<button class="btn btn-primary mobile-toggle" id="sidebar-toggle"><i class="bi bi-list"></i></button>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar-super-admin :: sidebar}"></div>
    <main class="main-content">
        <div class="page-header"><h1>Students</h1><p>View all students</p></div>
        <div class="content-card">
            <div th:replace="~{fragments/search-bar :: search('table-search', 'Search by name, email or phone...')}"></div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Created</th></tr></thead>
                    <tbody id="students-table"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
    requireAuth('SUPER_ADMIN');
    initSidebar('SUPER_ADMIN');
    SuperAdminApi.getStudents().then(res => {
        const tbody = document.getElementById('students-table');
        if (!res.data?.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No students found</td></tr>'; return; }
        tbody.innerHTML = res.data.map(s => `
            <tr class="${isUserActive(s.active) ? '' : 'table-row-inactive'}"><td>${s.name}</td><td>${s.email}</td><td>${s.phone || '-'}</td>
            <td>${userStatusBadge(s.active)}</td>
            <td>${formatDate(s.createdAt)}</td></tr>`).join('');
        bindTableSearch('table-search', 'students-table');
    }).catch(err => showAlert(err.message, 'danger'));
</script>
</body>
</html>
