<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Assignments')}"></head>
<body>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<button class="btn btn-primary mobile-toggle" id="sidebar-toggle"><i class="bi bi-list"></i></button>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar-student :: sidebar}"></div>
    <main class="main-content">
        <div class="page-header"><h1>Assignments</h1><p>View and submit your assignments</p></div>
        <div class="content-card">
            <div th:replace="~{fragments/search-bar :: search('table-search', 'Search by title or status...')}"></div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead><tr><th>Title</th><th>Due Date</th><th>Max Marks</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="assignments-table"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="submitModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="submitModalTitle">Submit Assignment</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form id="submit-form">
                <div class="modal-body">
                    <input type="hidden" id="submit-assignment-id">
                    <div id="assignment-details" class="mb-3 p-3 bg-light rounded"></div>
                    <div class="mb-3"><label class="form-label">Your Submission</label><textarea class="form-control" id="submit-text" rows="6" required placeholder="Enter your submission text..."></textarea></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="submit-btn">Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
    requireAuth('STUDENT');
    initSidebar('STUDENT');
    const studentId = getUser().id;
    let submitModal, isUpdate = false, allAssignments = [];

    document.addEventListener('DOMContentLoaded', () => {
        submitModal = new bootstrap.Modal(document.getElementById('submitModal'));
        loadAssignments();
        initSearch('table-search', q => renderAssignments(filterItems(allAssignments, q, a =>
            `${a.title} ${a.status || ''} ${a.maxMarks}`)));
    });

    function renderAssignments(list) {
        const tbody = document.getElementById('assignments-table');
        if (!list.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No assignments found</td></tr>'; return; }
        tbody.innerHTML = list.map(a => `
            <tr>
                <td>${a.title}</td>
                <td>${formatDate(a.dueDate)}</td>
                <td>${a.maxMarks}</td>
                <td>${statusBadge(a.status)}</td>
                <td><button class="btn btn-sm btn-primary" onclick="openSubmit(${a.id})">Submit / Update</button></td>
            </tr>`).join('');
    }

    async function loadAssignments() {
        try {
            const res = await StudentApi.getAssignments(studentId);
            allAssignments = res.data || [];
            const q = document.getElementById('table-search')?.value || '';
            renderAssignments(filterItems(allAssignments, q, a =>
                `${a.title} ${a.status || ''} ${a.maxMarks}`));
        } catch (err) { showAlert(err.message, 'danger'); }
    }

    async function openSubmit(assignmentId) {
        document.getElementById('submit-assignment-id').value = assignmentId;
        document.getElementById('submit-text').value = '';
        isUpdate = false;
        try {
            const [detailRes, statusRes] = await Promise.all([
                StudentApi.getAssignment(studentId, assignmentId),
                StudentApi.getSubmissionStatus(studentId, assignmentId).catch(() => null)
            ]);
            const a = detailRes.data;
            document.getElementById('assignment-details').innerHTML = `
                <strong>${a.title}</strong><br>
                <small class="text-muted">${a.description}</small><br>
                <small>Due: ${formatDate(a.dueDate)} | Max Marks: ${a.maxMarks}</small>`;

            if (statusRes && statusRes.data && statusRes.data !== 'PENDING') {
                isUpdate = true;
                document.getElementById('submitModalTitle').textContent = 'Update Submission';
                document.getElementById('submit-btn').textContent = 'Update';
                const resultRes = await StudentApi.getSubmissionResult(studentId, assignmentId).catch(() => null);
                if (resultRes?.data?.submissionText) {
                    document.getElementById('submit-text').value = resultRes.data.submissionText;
                }
            } else {
                document.getElementById('submitModalTitle').textContent = 'Submit Assignment';
                document.getElementById('submit-btn').textContent = 'Submit';
            }
            submitModal.show();
        } catch (err) { showAlert(err.message, 'danger'); }
    }

    document.getElementById('submit-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const assignmentId = document.getElementById('submit-assignment-id').value;
        const body = { submissionText: document.getElementById('submit-text').value };
        try {
            if (isUpdate) await StudentApi.updateSubmission(studentId, assignmentId, body);
            else await StudentApi.submitAssignment(studentId, assignmentId, body);
            showAlert(isUpdate ? 'Submission updated' : 'Assignment submitted');
            submitModal.hide();
            loadAssignments();
        } catch (err) { showAlert(err.message, 'danger'); }
    });
</script>
</body>
</html>
