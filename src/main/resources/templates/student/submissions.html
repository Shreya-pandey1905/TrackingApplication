<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Submissions')}"></head>
<body>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<button class="btn btn-primary mobile-toggle" id="sidebar-toggle"><i class="bi bi-list"></i></button>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar-student :: sidebar}"></div>
    <main class="main-content">
        <div class="page-header"><h1>Submissions</h1><p>View your submission history and results</p></div>
        <div class="content-card">
            <div th:replace="~{fragments/search-bar :: search('table-search', 'Search by assignment, feedback or status...')}"></div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead><tr><th>Assignment</th><th>Submitted</th><th>Marks</th><th>Feedback</th><th>Status</th></tr></thead>
                    <tbody id="submissions-table"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
    requireAuth('STUDENT');
    initSidebar('STUDENT');
    const studentId = getUser().id;
    let allSubmissions = [];

    function renderSubmissions(list) {
        const tbody = document.getElementById('submissions-table');
        if (!list.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No submissions yet</td></tr>'; return; }
        tbody.innerHTML = list.map(s => `
            <tr>
                <td>${s.assignment ? s.assignment.title : '-'}</td>
                <td>${formatDate(s.submittedAt)}</td>
                <td>${s.marks != null ? s.marks : '-'}</td>
                <td>${s.feedback || '-'}</td>
                <td>${statusBadge(s.status)}</td>
            </tr>`).join('');
    }

    StudentApi.getSubmissions(studentId).then(res => {
        allSubmissions = res.data || [];
        renderSubmissions(allSubmissions);
        initSearch('table-search', q => renderSubmissions(filterItems(allSubmissions, q, s =>
            `${s.assignment ? s.assignment.title : ''} ${s.feedback || ''} ${s.status || ''}`)));
    }).catch(err => showAlert(err.message, 'danger'));
</script>
</body>
</html>
