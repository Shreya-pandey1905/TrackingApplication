<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Assignments')}"></head>
<body>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<button class="btn btn-primary mobile-toggle" id="sidebar-toggle"><i class="bi bi-list"></i></button>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar-trainer :: sidebar}"></div>
    <main class="main-content">
        <div class="page-header d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div><h1>Assignments</h1><p>Create and manage your assignments</p></div>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#assignModal" onclick="openCreate()">
                <i class="bi bi-plus-lg"></i> Create Assignment
            </button>
        </div>
        <div class="content-card">
            <div th:replace="~{fragments/search-bar :: search('table-search', 'Search by title or status...')}"></div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead><tr><th>Title</th><th>Due Date</th><th>Max Marks</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="assignments-table"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="assignModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title" id="assignModalTitle">Create Assignment</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form id="assign-form">
                <div class="modal-body">
                    <input type="hidden" id="assign-id">
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">Title</label><input type="text" class="form-control" id="assign-title" required></div>
                        <div class="col-md-6"><label class="form-label">Max Marks</label><input type="number" class="form-control" id="assign-marks" min="1" required></div>
                        <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" id="assign-desc" rows="3" required></textarea></div>
                        <div class="col-md-6"><label class="form-label">Assigned Date</label><input type="datetime-local" class="form-control" id="assign-date" required></div>
                        <div class="col-md-6"><label class="form-label">Due Date</label><input type="datetime-local" class="form-control" id="assign-due" required></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="assignStudentsModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Assign to Students</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form id="assign-students-form">
                <div class="modal-body">
                    <input type="hidden" id="assign-to-id">
                    <div id="student-checkboxes" class="d-flex flex-column gap-2"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Assign</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
    requireAuth('TRAINER');
    initSidebar('TRAINER');
    let assignModal, assignStudentsModal, students = [], assignments = [];

    document.addEventListener('DOMContentLoaded', async () => {
        assignModal = new bootstrap.Modal(document.getElementById('assignModal'));
        assignStudentsModal = new bootstrap.Modal(document.getElementById('assignStudentsModal'));
        const sRes = await TrainerApi.getStudents();
        students = sRes.data || [];
        loadAssignments();
        initSearch('table-search', q => renderAssignments(filterItems(assignments, q, a =>
            `${a.title} ${a.status || ''} ${a.maxMarks}`)));
    });

    function openCreate() {
        document.getElementById('assignModalTitle').textContent = 'Create Assignment';
        document.getElementById('assign-id').value = '';
        document.getElementById('assign-form').reset();
        setupAssignmentDates();
    }

    function editAssignment(id) {
        const a = assignments.find(x => x.id === id);
        if (!a) return;
        document.getElementById('assignModalTitle').textContent = 'Edit Assignment';
        document.getElementById('assign-id').value = a.id;
        document.getElementById('assign-title').value = a.title;
        document.getElementById('assign-desc').value = a.description;
        document.getElementById('assign-marks').value = a.maxMarks;
        document.getElementById('assign-date').value = toDateTimeLocal(a.assignedDate);
        document.getElementById('assign-due').value = toDateTimeLocal(a.dueDate);
        setupAssignmentDates();
        assignModal.show();
    }

    async function loadAssignments() {
        try {
            const res = await TrainerApi.getAssignments();
            assignments = res.data || [];
            const q = document.getElementById('table-search')?.value || '';
            renderAssignments(filterItems(assignments, q, a =>
                `${a.title} ${a.status || ''} ${a.maxMarks}`));
        } catch (err) { showAlert(err.message, 'danger'); }
    }

    function renderAssignments(list) {
        const data = list !== undefined ? list : assignments;
        const tbody = document.getElementById('assignments-table');
        if (!data.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No assignments found</td></tr>'; return; }
        tbody.innerHTML = data.map(a => `
                <tr>
                    <td>${a.title}</td><td>${formatDate(a.dueDate)}</td><td>${a.maxMarks}</td>
                    <td>${statusBadge(a.status)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-secondary me-1" onclick="editAssignment(${a.id})"><i class="bi bi-pencil"></i></button>
                        <button class="btn btn-sm btn-outline-primary" onclick="openAssignStudents(${a.id})">Assign</button>
                    </td>
                </tr>`).join('');
    }

    document.getElementById('assign-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const assigned = document.getElementById('assign-date').value;
        const due = document.getElementById('assign-due').value;
        const dateErr = validateAssignmentDates(assigned, due);
        if (dateErr) { showAlert(dateErr, 'danger'); return; }

        const body = {
            title: document.getElementById('assign-title').value,
            description: document.getElementById('assign-desc').value,
            assignedDate: fromDateTimeLocal(assigned),
            dueDate: fromDateTimeLocal(due),
            maxMarks: parseInt(document.getElementById('assign-marks').value),
            trainerId: parseInt(getUser().id)
        };
        const id = document.getElementById('assign-id').value;
        try {
            if (id) await TrainerApi.updateAssignment(id, body);
            else await TrainerApi.createAssignment(body);
            showAlert(id ? 'Assignment updated' : 'Assignment created');
            assignModal.hide();
            loadAssignments();
        } catch (err) { showAlert(err.message, 'danger'); }
    });

    function openAssignStudents(assignmentId) {
        document.getElementById('assign-to-id').value = assignmentId;
        document.getElementById('student-checkboxes').innerHTML = students.map(s => `
            <div class="form-check"><input class="form-check-input" type="checkbox" value="${s.id}" id="stu-${s.id}">
            <label class="form-check-label" for="stu-${s.id}">${s.name} (${s.email})</label></div>`).join('') || '<p class="text-muted">No students available</p>';
        assignStudentsModal.show();
    }

    document.getElementById('assign-students-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const assignmentId = document.getElementById('assign-to-id').value;
        const studentIds = [...document.querySelectorAll('#student-checkboxes input:checked')].map(c => parseInt(c.value));
        if (!studentIds.length) { showAlert('Select at least one student', 'warning'); return; }
        try {
            await TrainerApi.assignAssignment(assignmentId, studentIds);
            showAlert('Assignment assigned');
            assignStudentsModal.hide();
            loadAssignments();
        } catch (err) { showAlert(err.message, 'danger'); }
    });
</script>
</body>
</html>
