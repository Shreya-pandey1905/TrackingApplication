<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Submissions')}"></head>
<body>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<button class="btn btn-primary mobile-toggle" id="sidebar-toggle"><i class="bi bi-list"></i></button>
<div class="app-layout">
    <div th:replace="~{fragments/sidebar-trainer :: sidebar}"></div>
    <main class="main-content">
        <div class="page-header"><h1>Submissions</h1><p>Review and evaluate student submissions</p></div>
        <div class="content-card mb-3" style="max-width: 400px;">
            <label class="form-label">Select Assignment</label>
            <select class="form-select" id="assignment-select" onchange="loadSubmissions()">
                <option value="">-- Select assignment --</option>
            </select>
        </div>
        <div class="content-card">
            <div th:replace="~{fragments/search-bar :: search('table-search', 'Search by student or status...')}"></div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead><tr><th>Student</th><th>Submitted</th><th>Marks</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="submissions-table"><tr><td colspan="5" class="text-center text-muted">Select an assignment</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div class="modal fade" id="evaluateModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">Evaluate Submission</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form id="evaluate-form">
                <div class="modal-body">
                    <input type="hidden" id="eval-submission-id">
                    <div class="mb-3"><label class="form-label">Marks</label><input type="number" class="form-control" id="eval-marks" min="0" required></div>
                    <div class="mb-3"><label class="form-label">Feedback</label><textarea class="form-control" id="eval-feedback" rows="3" required></textarea></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Submit Evaluation</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
    requireAuth('TRAINER');
    initSidebar('TRAINER');
    let evaluateModal, submissions = [];

    document.addEventListener('DOMContentLoaded', async () => {
        evaluateModal = new bootstrap.Modal(document.getElementById('evaluateModal'));
        const res = await TrainerApi.getAssignments();
        const select = document.getElementById('assignment-select');
        (res.data || []).forEach(a => {
            select.innerHTML += `<option value="${a.id}">${a.title}</option>`;
        });
        initSearch('table-search', q => renderSubmissions(filterItems(submissions, q, s =>
            `${s.student ? s.student.name : ''} ${s.status || ''} ${s.marks != null ? s.marks : ''}`)));
    });

    async function loadSubmissions() {
        const id = document.getElementById('assignment-select').value;
        if (!id) return;
        try {
            const res = await TrainerApi.getSubmissions(id);
            submissions = res.data || [];
            const searchVal = document.getElementById('table-search')?.value || '';
            renderSubmissions(filterItems(submissions, searchVal, s =>
                `${s.student ? s.student.name : ''} ${s.status || ''} ${s.marks != null ? s.marks : ''}`));
        } catch (err) { showAlert(err.message, 'danger'); }
    }

    function renderSubmissions(list) {
        const tbody = document.getElementById('submissions-table');
        if (!list.length) { tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No submissions found</td></tr>'; return; }
        tbody.innerHTML = list.map(s => `
                <tr>
                    <td>${s.student ? s.student.name : '-'}</td>
                    <td>${formatDate(s.submittedAt)}</td>
                    <td>${s.marks != null ? s.marks : '-'}</td>
                    <td>${statusBadge(s.status)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="openEvaluate(${s.id})">Evaluate</button>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-secondary" onclick="changeStatus(${s.id}, 'SUBMITTED')">Submitted</button>
                            <button class="btn btn-outline-secondary" onclick="changeStatus(${s.id}, 'EVALUATED')">Evaluated</button>
                        </div>
                    </td>
                </tr>`).join('');
    }

    function openEvaluate(submissionId) {
        document.getElementById('eval-submission-id').value = submissionId;
        const s = submissions.find(x => x.id === submissionId);
        if (s) {
            document.getElementById('eval-marks').value = s.marks || '';
            document.getElementById('eval-feedback').value = s.feedback || '';
        }
        evaluateModal.show();
    }

    document.getElementById('evaluate-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('eval-submission-id').value;
        try {
            await TrainerApi.evaluateSubmission(id, {
                marks: parseInt(document.getElementById('eval-marks').value),
                feedback: document.getElementById('eval-feedback').value
            });
            showAlert('Submission evaluated');
            evaluateModal.hide();
            loadSubmissions();
        } catch (err) { showAlert(err.message, 'danger'); }
    });

    async function changeStatus(submissionId, status) {
        try {
            await TrainerApi.changeSubmissionStatus(submissionId, status);
            showAlert('Status updated');
            loadSubmissions();
        } catch (err) { showAlert(err.message, 'danger'); }
    }
</script>
</body>
</html>
