<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}"></head>
<body class="login-page">
<div th:replace="~{fragments/alerts :: alerts}"></div>

<div class="login-card">
    <div class="login-brand">
        <h1>Tracking App</h1>
        <p>Assignment &amp; Submission Management</p>
    </div>

    <form id="login-form">
        <div class="mb-3">
            <label class="form-label" for="role">Login As</label>
            <select class="form-select" id="role" required>
                <option value="SUPER_ADMIN">Super Admin</option>
                <option value="ADMIN">Admin</option>
                <option value="TRAINER">Trainer</option>
                <option value="STUDENT">Student</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2" id="login-btn">
            Sign In
        </button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/api.js}"></script>
<script>
    const user = getUser();
    if (getToken() && user.role) {
        window.location.href = ROLE_ROUTES[user.role];
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        btn.disabled = true;
        btn.textContent = 'Signing in...';

        try {
            const role = document.getElementById('role').value;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const data = await login(role, email, password);
            saveAuth(data);
            window.location.href = ROLE_ROUTES[data.role];
        } catch (err) {
            showAlert(err.message || 'Login failed', 'danger');
            btn.disabled = false;
            btn.textContent = 'Sign In';
        }
    });
</script>
</body>
</html>
